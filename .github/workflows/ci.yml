name: CI
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up pnpm
              uses: pnpm/action-setup@v6.1.0
              # Do not pass `version`. The action reads packageManager from package.json.

            - name: Set up Node.js
              uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run type check
              run: pnpm run typecheck

            - name: Run lint
              run: pnpm run lint

            - name: Check formatting
              run: pnpm run format:check

            - name: Assert the database migrations are consistent
              run: pnpm run db:check

            - name: Run tests with coverage
              run: pnpm run test -- --coverage

            - name: Build
              run: pnpm run build

            # Also fails on a published source map and on any post-ES6 syntax, so the shell steps
            # that used to check those two things separately are no longer needed.
            - name: Assert the client bundle stays small and parses on ES6
              run: node scripts/check-bundle-budget.mjs

            - name: Upload coverage report
              uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
              if: always()
              with:
                  name: coverage-report
                  path: coverage/